name: Terraform CI - Plan

on:
  push:
    branches:
      - main
      - feature/project-12-terraform-plan
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ci-terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Generate readable plan
        run: terraform show -no-color tfplan > terraform-plan.txt

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ci-terraform/tfplan
            ci-terraform/terraform-plan.txt
          retention-days: 7
